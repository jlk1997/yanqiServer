services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yanqi
      POSTGRES_PASSWORD: yanqi
      POSTGRES_DB: yanqi_match
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanqi -d yanqi_match && psql -U yanqi -d yanqi_match -c 'SELECT extname FROM pg_extension WHERE extname = \\'vector\\'' | grep -q vector"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yanqi
      MINIO_ROOT_PASSWORD: yanqiyanqi
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  miniodata:
